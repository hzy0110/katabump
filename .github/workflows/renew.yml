name: Schedule Test

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger
        run: |
          echo "================================"
          echo "GitHub Actions trigger test"
          echo "Event: ${{ github.event_name }}"
          echo "Time UTC:"
          date -u
          echo "================================"
